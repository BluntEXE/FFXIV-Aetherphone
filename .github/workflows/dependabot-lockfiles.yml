name: Refresh Dependabot lock files

# Dependabot bumps the PackageReference but never regenerates packages.lock.json,
# and CI restores with --locked-mode because Directory.Build.props sets
# RestorePackagesWithLockFile. Every NuGet Dependabot pull request therefore fails
# restore with NU1004 before it builds anything. This regenerates both lock files
# on the Dependabot branch so the pull request can go green on its own.
#
# Dependabot-triggered runs get a read-only GITHUB_TOKEN no matter what this file
# declares, so the push needs a PAT, and it has to live in the *Dependabot* secret
# scope (Settings, Secrets and variables, Dependabot) rather than the Actions one.
# Without it the job explains itself and exits green instead of failing every
# dependency pull request a second way.

on:
  push:
    branches:
      - 'dependabot/nuget/**'

permissions:
  contents: write

concurrency:
  group: dependabot-lockfiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check for the push token
        id: token
        env:
          HUB_REPO_PAT: ${{ secrets.HUB_REPO_PAT }}
        run: |
          if [ -z "$HUB_REPO_PAT" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "HUB_REPO_PAT is not set in the Dependabot secret scope; skipping the lock file refresh."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.HUB_REPO_PAT }}

      - name: Set up .NET
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate lock files
        if: steps.token.outputs.present == 'true'
        run: dotnet restore Aetherphone.sln --force-evaluate

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        run: |
          if [ -z "$(git status --porcelain -- '*packages.lock.json')" ]; then
            echo "Lock files already match the manifests; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          git commit -m "deps: regenerate the NuGet lock files"
          git push origin "HEAD:${{ github.ref_name }}"
